<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Incommensurate Magnetic Helix – Spin Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; font-family: 'Georgia', serif; overflow: hidden; }
  #container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; }
  canvas { display: block; }

  #labels {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  #labels h1 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 0.04em;
    color: #1a1a2e;
    font-style: italic;
  }
  #labels p {
    font-size: 11px;
    color: #793838;
    margin-top: 3px;
    letter-spacing: 0.02em;
  }

  #legend {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .leg-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: #333;
  }
  .leg-sph { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #dde4f0, #7a8baa); }
  .leg-arr {
    width: 22px; height: 3px;
    background: #e02020;
    position: relative;
  }
  .leg-arr::after {
    content: '';
    position: absolute;
    right: -1px; top: -4px;
    border-left: 8px solid #e02020;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .leg-bond { width: 22px; height: 5px; background: #8a909c; border-radius: 2px; }

  #controls {
    position: absolute;
    bottom: 22px; right: 20px;
    font-size: 10.5px; color: #888;
    text-align: right;
    pointer-events: none;
    z-index: 10;
  }

  .dg.ac { z-index: 20 !important; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
<div id="container">
  <div id="labels">
    <h1>Cadena de espines en hélice magnética inconmensurable</h1>
    <p id="dynamic-subtitle">Q = 2.10838 rad &nbsp;|&nbsp; Dímeros: espaciado corto / largo alternado</p>
  </div>

  <div id="legend">
    <div class="leg-item"><div class="leg-sph"></div><span>átomo (dímero)</span></div>
    <div class="leg-item"><div class="leg-bond"></div><span>enlace intra-dímero</span></div>
    <div class="leg-item"><div class="leg-arr"></div><span>espín S<sub>i</sub></span></div>
  </div>

  <div id="controls">Arrastrar para rotar &nbsp;|&nbsp; Rueda: zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene ────────────────────────────────────────────────────────────────────
const container = document.getElementById('container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0xffffff, 1);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// ─── Camera ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(28, W / H, 0.01, 200);
camera.position.set(0, 6, 16);
camera.lookAt(0, 0, 0);

// ─── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(6, 10, 8);
scene.add(key);

const fill = new THREE.DirectionalLight(0xd0e0ff, 0.4);
fill.position.set(-5, 3, -4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffeedd, 0.3);
rim.position.set(0, -6, -10);
scene.add(rim);

// ─── Chain parameters ─────────────────────────────────────────────────────────
const INITIAL_DIMERS = 20;
const D_INTRA     = 0.42;   // short bond within dimer
const D_INTER     = 0.72;   // larger gap between dimers
const R_ATOM      = 0.14;
const SPIN_LEN    = 0.58;
const HEAD_L      = 0.16;
const HEAD_R      = 0.065;

const physicsParams = {
  n_dimers: INITIAL_DIMERS,
  view_mode: 'PBC anillo',
  Q: 2.10838,
  gamma: -0.28,
  alpha_ind: 0.0,
  phi_ind: 0.0,
  autoRotate: true
};

// ─── Materials ────────────────────────────────────────────────────────────────
const matAtom = new THREE.MeshPhongMaterial({
  color: 0xb4bfce, specular: 0x888ea8, shininess: 110
});
const matBond = new THREE.MeshPhongMaterial({
  color: 0x8a909c, specular: 0x555560, shininess: 60
});
const matArrow = new THREE.MeshPhongMaterial({
  color: 0xe01010, specular: 0xff5555, shininess: 90,
  emissive: 0x330000
});
const WORLD_UP = new THREE.Vector3(0, 1, 0);

// ─── Spin arrows (dynamic) ───────────────────────────────────────────────────
function makeArrowAlongX() {
  const group = new THREE.Group();
  const shaftLen = SPIN_LEN - HEAD_L;
  const gShaft = new THREE.CylinderGeometry(0.025, 0.025, shaftLen, 8);
  const mShaft = new THREE.Mesh(gShaft, matArrow.clone());
  mShaft.position.set(shaftLen / 2, 0, 0);
  mShaft.rotation.z = -Math.PI / 2;
  group.add(mShaft);

  const gHead = new THREE.ConeGeometry(HEAD_R, HEAD_L, 10);
  const mHead = new THREE.Mesh(gHead, matArrow.clone());
  mHead.position.set(shaftLen + HEAD_L / 2, 0, 0);
  mHead.rotation.z = -Math.PI / 2;
  group.add(mHead);
  return group;
}

const chainGroup = new THREE.Group();
scene.add(chainGroup);

const spinObjects = [];
const VIEW_MODES = {
  ring: 'PBC anillo',
  line: 'Cadena lineal'
};

function clearChainGroup() {
  chainGroup.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
  });
  while (chainGroup.children.length > 0) {
    chainGroup.remove(chainGroup.children[0]);
  }
  spinObjects.length = 0;
}

function buildRingChain(nDimers) {
  const siteAngles = [];
  let arcLength = 0;
  const cellLength = D_INTRA + D_INTER;
  const totalLength = nDimers * cellLength;
  const ringRadius = totalLength / (2 * Math.PI);

  for (let d = 0; d < nDimers; d++) {
    siteAngles.push((arcLength / totalLength) * 2 * Math.PI);
    arcLength += D_INTRA;
    siteAngles.push((arcLength / totalLength) * 2 * Math.PI);
    arcLength += D_INTER;
  }

  const gAtom = new THREE.SphereGeometry(R_ATOM, 20, 20);
  siteAngles.forEach((angle, n) => {
    const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
    const tangent = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle));
    const atomPos = radial.clone().multiplyScalar(ringRadius);

    const m = new THREE.Mesh(gAtom, matAtom);
    m.position.copy(atomPos);
    chainGroup.add(m);

    const pivot = new THREE.Group();
    pivot.position.copy(atomPos);

    // Base local: X radial, Y normal al plano, Z tangente a la cadena.
    // Con esta base, rotar en Z hace girar el espin en el plano normal
    // (radial-normal), perpendicular al eje local de la cadena.
    const basis = new THREE.Matrix4().makeBasis(radial, WORLD_UP, tangent);
    pivot.setRotationFromMatrix(basis);

    const arrow = makeArrowAlongX();
    pivot.add(arrow);
    chainGroup.add(pivot);
    spinObjects.push({ pivot, n });
  });

  for (let i = 0; i < siteAngles.length; i++) {
    const j = (i + 1) % siteAngles.length;
    const a0 = siteAngles[i];
    let a1 = siteAngles[j];
    if (j === 0) a1 += 2 * Math.PI;

    const angleGap = (R_ATOM / ringRadius) * 0.9;
    const startArc = a0 + angleGap;
    const endArc = a1 - angleGap;
    if (endArc <= startArc) continue;

    const points = [];
    const segments = 12;
    for (let s = 0; s <= segments; s++) {
      const t = s / segments;
      const a = startArc + t * (endArc - startArc);
      points.push(new THREE.Vector3(ringRadius * Math.cos(a), 0, ringRadius * Math.sin(a)));
    }

    const bondPath = new THREE.CatmullRomCurve3(points);
    const gBond = new THREE.TubeGeometry(bondPath, segments, 0.038, 8, false);
    const mBond = new THREE.Mesh(gBond, matBond);
    chainGroup.add(mBond);
  }
}

function buildLineChain(nDimers) {
  const positions = [];
  let z = 0;
  for (let d = 0; d < nDimers; d++) {
    positions.push(z);
    z += D_INTRA;
    positions.push(z);
    z += D_INTER;
  }

  const totalLen = z - D_INTER;
  const zOffset = -totalLen / 2;
  positions.forEach((_, i) => positions[i] += zOffset);

  const gAtom = new THREE.SphereGeometry(R_ATOM, 20, 20);
  positions.forEach((posZ, n) => {
    const m = new THREE.Mesh(gAtom, matAtom);
    m.position.set(0, 0, posZ);
    chainGroup.add(m);

    const pivot = new THREE.Group();
    pivot.position.set(0, 0, posZ);
    const arrow = makeArrowAlongX();
    pivot.add(arrow);
    chainGroup.add(pivot);
    spinObjects.push({ pivot, n });
  });

  for (let i = 0; i < positions.length - 1; i++) {
    const z0 = positions[i];
    const z1 = positions[i + 1];
    const len = (z1 - z0) - 1.8 * R_ATOM;
    if (len <= 0) continue;
    const gBond = new THREE.CylinderGeometry(0.038, 0.038, len, 9);
    const mBond = new THREE.Mesh(gBond, matBond);
    mBond.position.set(0, 0, (z0 + z1) / 2);
    mBond.rotation.x = Math.PI / 2;
    chainGroup.add(mBond);
  }
}

function buildChain() {
  clearChainGroup();
  const nDimers = Math.max(2, Math.floor(physicsParams.n_dimers));
  physicsParams.n_dimers = nDimers;

  if (physicsParams.view_mode === VIEW_MODES.line) {
    buildLineChain(nDimers);
  } else {
    buildRingChain(nDimers);
  }
}

function updateSpins() {
  const { Q, gamma, alpha_ind, phi_ind } = physicsParams;

  spinObjects.forEach((spin) => {
    const n = spin.n;
    const parity = (n % 2 === 0) ? 1.0 : -1.0;
    const thetaSpin = (n * Q) + (gamma * parity) + alpha_ind * Math.sin(2.0 * Q * n + phi_ind);
    spin.pivot.rotation.z = thetaSpin;
  });

  document.getElementById('dynamic-subtitle').innerHTML =
    `Modo = ${physicsParams.view_mode} &nbsp;|&nbsp; N<sub>d</sub> = ${physicsParams.n_dimers} &nbsp;|&nbsp; Q = ${Q.toFixed(5)} rad &nbsp;|&nbsp; γ = ${gamma.toFixed(2)} &nbsp;|&nbsp; α<sub>ind</sub> = ${alpha_ind.toFixed(2)}`;
}

buildChain();
updateSpins();

const gui = new dat.GUI({ width: 320 });
gui.add(physicsParams, 'view_mode', [VIEW_MODES.ring, VIEW_MODES.line]).name('Visualizacion').onChange((mode) => {
  radius = (mode === VIEW_MODES.line) ? 18 : 16;
  updateCamera();
  buildChain();
  updateSpins();
});
gui.add(physicsParams, 'n_dimers', 2, 80).step(1).name('Numero de dimeros (N_d)').onFinishChange(() => {
  buildChain();
  updateSpins();
});
gui.add(physicsParams, 'Q', 0, Math.PI).step(0.0001).name('Pitch (Q)').onChange(updateSpins);
gui.add(physicsParams, 'gamma', -Math.PI, Math.PI).step(0.01).name('Dimerizacion (gamma)').onChange(updateSpins);
gui.add(physicsParams, 'alpha_ind', 0.0, 1.5).step(0.01).name('Bunching (alpha_ind)').onChange(updateSpins);
gui.add(physicsParams, 'phi_ind', -Math.PI, Math.PI).step(0.01).name('Fase (phi_ind)').onChange(updateSpins);
gui.add(physicsParams, 'autoRotate').name('Auto-rotacion');

// ─── Orbit controls (manual implementation) ───────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;
let phi = Math.PI / 6, theta_cam = 0.3, radius = 16;

function updateCamera() {
  camera.position.x = radius * Math.sin(phi) * Math.sin(theta_cam);
  camera.position.y = radius * Math.cos(phi);
  camera.position.z = radius * Math.sin(phi) * Math.cos(theta_cam);
  camera.lookAt(0, 0, 0);
}
updateCamera();

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  physicsParams.autoRotate = false;
});
renderer.domElement.addEventListener('mouseup',   () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = (e.clientX - lastX) * 0.008;
  const dy = (e.clientY - lastY) * 0.006;
  theta_cam -= dx;
  phi = Math.max(0.15, Math.min(Math.PI - 0.1, phi + dy));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  radius = Math.max(5, Math.min(35, radius + e.deltaY * 0.02));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// Touch
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    physicsParams.autoRotate = false;
  }
});
renderer.domElement.addEventListener('touchend', () => isDragging = false);
renderer.domElement.addEventListener('touchmove', e => {
  if (!isDragging || e.touches.length !== 1) return;
  const dx = (e.touches[0].clientX - lastX) * 0.008;
  const dy = (e.touches[0].clientY - lastY) * 0.006;
  theta_cam -= dx;
  phi = Math.max(0.15, Math.min(Math.PI - 0.1, phi + dy));
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  updateCamera();
  e.preventDefault();
}, { passive: false });

// ─── Render loop ──────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (physicsParams.autoRotate) {
    theta_cam += 0.004;
    updateCamera();
  }
  renderer.render(scene, camera);
}
animate();

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
