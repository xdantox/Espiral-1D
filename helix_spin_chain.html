<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Incommensurate Magnetic Helix – Spin Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; font-family: 'Georgia', serif; overflow: hidden; }
  #container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; }
  canvas { display: block; }

  #labels {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }
  #labels h1 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 0.04em;
    color: #1a1a2e;
    font-style: italic;
  }
  #labels p {
    font-size: 11px;
    color: #666;
    margin-top: 3px;
    letter-spacing: 0.02em;
  }

  #legend {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    align-items: center;
    pointer-events: none;
  }
  .leg-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: #333;
  }
  .leg-sph { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #dde4f0, #7a8baa); }
  .leg-arr {
    width: 22px; height: 3px;
    background: #e02020;
    position: relative;
  }
  .leg-arr::after {
    content: '';
    position: absolute;
    right: -1px; top: -4px;
    border-left: 8px solid #e02020;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .leg-bond { width: 22px; height: 5px; background: #8a909c; border-radius: 2px; }

  #controls {
    position: absolute;
    bottom: 22px; right: 20px;
    font-size: 10.5px; color: #888;
    text-align: right;
  }
</style>
</head>
<body>
<div id="container">
  <div id="labels">
    <h1>Cadena de espines en hélice magnética inconmensurable</h1>
    <p>Q = 2.10838 ≈ 120.8° por sitio &nbsp;|&nbsp; Dímeros: espaciado corto / largo alternado</p>
  </div>

  <div id="legend">
    <div class="leg-item"><div class="leg-sph"></div><span>átomo (dímero)</span></div>
    <div class="leg-item"><div class="leg-bond"></div><span>enlace intra-dímero</span></div>
    <div class="leg-item"><div class="leg-arr"></div><span>espín S<sub>i</sub></span></div>
  </div>

  <div id="controls">Arrastrar para rotar &nbsp;|&nbsp; Rueda: zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene ────────────────────────────────────────────────────────────────────
const container = document.getElementById('container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0xffffff, 1);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// ─── Camera ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(28, W / H, 0.01, 200);
camera.position.set(0, 6, 16);
camera.lookAt(0, 0, 0);

// ─── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(6, 10, 8);
scene.add(key);

const fill = new THREE.DirectionalLight(0xd0e0ff, 0.4);
fill.position.set(-5, 3, -4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffeedd, 0.3);
rim.position.set(0, -6, -10);
scene.add(rim);

// ─── Chain parameters ─────────────────────────────────────────────────────────
const N_DIMERS    = 20;
const D_INTRA     = 0.42;   // short bond within dimer
const D_INTER     = 0.72;   // larger gap between dimers
const R_ATOM      = 0.14;
const SPIN_LEN    = 0.58;
const HEAD_L      = 0.16;
const HEAD_R      = 0.065;
// Incommensurate wavevector: golden angle per atom
const Q = 2.2;  // ≈ 120.8°

// ─── Materials ────────────────────────────────────────────────────────────────
const matAtom = new THREE.MeshPhongMaterial({
  color: 0xb4bfce, specular: 0x888ea8, shininess: 110
});
const matBond = new THREE.MeshPhongMaterial({
  color: 0x8a909c, specular: 0x555560, shininess: 60
});
const matArrow = new THREE.MeshPhongMaterial({
  color: 0xe01010, specular: 0xff5555, shininess: 90,
  emissive: 0x330000
});

// ─── Build atom positions ──────────────────────────────────────────────────────
const positions = [];
let z = 0;
for (let d = 0; d < N_DIMERS; d++) {
  positions.push(z);
  z += D_INTRA;
  positions.push(z);
  z += D_INTER;
}
const totalLen = z - D_INTER;
const zOffset  = -totalLen / 2;
positions.forEach((_, i) => positions[i] += zOffset);

// ─── Atom spheres ─────────────────────────────────────────────────────────────
const gAtom = new THREE.SphereGeometry(R_ATOM, 20, 20);
positions.forEach(z => {
  const m = new THREE.Mesh(gAtom, matAtom);
  m.position.set(0, 0, z);
  scene.add(m);
});

// ─── Intra-dimer bonds (cylinders) ────────────────────────────────────────────
for (let d = 0; d < N_DIMERS; d++) {
  const z0 = positions[d * 2], z1 = positions[d * 2 + 1];
  const len = z1 - z0 - 1.8 * R_ATOM;
  const gBond = new THREE.CylinderGeometry(0.038, 0.038, len, 9);
  const m = new THREE.Mesh(gBond, matBond);
  m.position.set(0, 0, (z0 + z1) / 2);
  m.rotation.x = Math.PI / 2;
  scene.add(m);
}

// ─── Spin arrows ──────────────────────────────────────────────────────────────
// Custom arrow: cylinder shaft + cone head
function makeArrow(theta) {
  const group = new THREE.Group();
  const sx = Math.cos(theta), sy = Math.sin(theta);
  const dir = new THREE.Vector3(sx, sy, 0);

  const shaftLen = SPIN_LEN - HEAD_L;
  const gShaft = new THREE.CylinderGeometry(0.025, 0.025, shaftLen, 8);
  const mShaft = new THREE.Mesh(gShaft, matArrow.clone());
  // shaft: starts at origin, points along dir
  mShaft.position.copy(dir.clone().multiplyScalar(shaftLen / 2));
  mShaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  group.add(mShaft);

  const gHead = new THREE.ConeGeometry(HEAD_R, HEAD_L, 10);
  const mHead = new THREE.Mesh(gHead, matArrow.clone());
  mHead.position.copy(dir.clone().multiplyScalar(shaftLen + HEAD_L / 2));
  mHead.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  group.add(mHead);

  return group;
}

positions.forEach((z, i) => {
  const theta = i * Q;
  const arrow = makeArrow(theta);
  arrow.position.set(0, 0, z);
  scene.add(arrow);
});

// ─── Axis indicator (chain axis, thin gray line) ──────────────────────────────
const axisGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0, 0, zOffset - 0.4),
  new THREE.Vector3(0, 0, -zOffset + 0.4)
]);
const axisLine = new THREE.Line(axisGeo, new THREE.LineBasicMaterial({
  color: 0xbbbbbb, linewidth: 1
}));
scene.add(axisLine);

// Small axis label cone (arrowhead at end)
const gAxisHead = new THREE.ConeGeometry(0.045, 0.15, 10);
const mAxisHead = new THREE.Mesh(gAxisHead, new THREE.MeshPhongMaterial({ color: 0x999999 }));
mAxisHead.position.set(0, 0, -zOffset + 0.48);
mAxisHead.rotation.x = -Math.PI / 2;
scene.add(mAxisHead);

// ─── Orbit controls (manual implementation) ───────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;
let phi = Math.PI / 6, theta_cam = 0.3, radius = 16;

function updateCamera() {
  camera.position.x = radius * Math.sin(phi) * Math.sin(theta_cam);
  camera.position.y = radius * Math.cos(phi);
  camera.position.z = radius * Math.sin(phi) * Math.cos(theta_cam);
  camera.lookAt(0, 0, 0);
}
updateCamera();

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
renderer.domElement.addEventListener('mouseup',   () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = (e.clientX - lastX) * 0.008;
  const dy = (e.clientY - lastY) * 0.006;
  theta_cam -= dx;
  phi = Math.max(0.15, Math.min(Math.PI - 0.1, phi + dy));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  radius = Math.max(5, Math.min(35, radius + e.deltaY * 0.02));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// Touch
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
});
renderer.domElement.addEventListener('touchend', () => isDragging = false);
renderer.domElement.addEventListener('touchmove', e => {
  if (!isDragging || e.touches.length !== 1) return;
  const dx = (e.touches[0].clientX - lastX) * 0.008;
  const dy = (e.touches[0].clientY - lastY) * 0.006;
  theta_cam -= dx;
  phi = Math.max(0.15, Math.min(Math.PI - 0.1, phi + dy));
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  updateCamera();
  e.preventDefault();
}, { passive: false });

// ─── Auto-rotation (gentle) ───────────────────────────────────────────────────
let autoRotate = true;
renderer.domElement.addEventListener('mousedown', () => autoRotate = false);

// ─── Render loop ──────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (autoRotate) {
    theta_cam += 0.004;
    updateCamera();
  }
  renderer.render(scene, camera);
}
animate();

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
