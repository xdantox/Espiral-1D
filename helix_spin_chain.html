<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Incommensurate Magnetic Helix – Spin Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; font-family: 'Georgia', serif; overflow: hidden; }
  #container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; }
  canvas { display: block; }

  #labels {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  #labels h1 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 0.04em;
    color: #1a1a2e;
    font-style: italic;
  }
  #labels p {
    font-size: 11px;
    color: #793838;
    margin-top: 3px;
    letter-spacing: 0.02em;
  }

  #legend {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    pointer-events: none;
    z-index: 10;
    width: 85%;
  }
  .leg-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: #333;
  }
  .leg-sph { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #dde4f0, #7a8baa); }
  .leg-arr {
    width: 22px; height: 3px;
    background: #e02020;
    position: relative;
  }
  .leg-arr::after {
    content: '';
    position: absolute;
    right: -1px; top: -4px;
    border-left: 8px solid #e02020;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .leg-bond { width: 22px; height: 5px; background: #8a909c; border-radius: 2px; }
  
  .leg-axis-x { width: 18px; height: 2px; background: #2b5cff; position: relative; }
  .leg-axis-x::after { content: ''; position: absolute; right: -2px; top: -2.5px; border-left: 5px solid #2b5cff; border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }
  
  .leg-axis-y { width: 18px; height: 2px; background: #1f9e2e; position: relative; }
  .leg-axis-y::after { content: ''; position: absolute; right: -2px; top: -2.5px; border-left: 5px solid #1f9e2e; border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }
  
  .leg-axis-z { width: 18px; height: 2px; background: #ff9900; position: relative; }
  .leg-axis-z::after { content: ''; position: absolute; right: -2px; top: -2.5px; border-left: 5px solid #ff9900; border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }

  #controls {
    position: absolute;
    bottom: 22px; right: 20px;
    font-size: 10.5px; color: #888;
    text-align: right;
    pointer-events: none;
    z-index: 10;
  }

  .dg.ac { z-index: 20 !important; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
<div id="container">
  <div id="labels">
    <h1>Cadena de espines en hélice magnética inconmensurable</h1>
    <p id="dynamic-subtitle">Q = 2.10838 rad &nbsp;|&nbsp; Dímeros: espaciado corto / largo alternado</p>
  </div>

  <div id="legend">
    <div class="leg-item"><div class="leg-sph"></div><span>átomo</span></div>
    <div class="leg-item"><div class="leg-bond"></div><span>enlace</span></div>
    <div class="leg-item"><div class="leg-arr"></div><span>espín S<sub>i</sub></span></div>
    <div class="leg-item"><div class="leg-axis-x"></div><span>Eje X (Cadena)</span></div>
    <div class="leg-item"><div class="leg-axis-y"></div><span>Eje Y (Hard-axis)</span></div>
    <div class="leg-item"><div class="leg-axis-z"></div><span>Eje Z (Easy-axis / θ=0)</span></div>
  </div>

  <div id="controls">Arrastrar para rotar &nbsp;|&nbsp; Rueda: zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene ────────────────────────────────────────────────────────────────────
const container = document.getElementById('container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0xffffff, 1);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(28, W / H, 0.01, 200);
camera.position.set(0, 6, 16);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(6, 10, 8);
scene.add(key);
const fill = new THREE.DirectionalLight(0xd0e0ff, 0.4);
fill.position.set(-5, 3, -4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffeedd, 0.3);
rim.position.set(0, -6, -10);
scene.add(rim);

// ─── Chain parameters ─────────────────────────────────────────────────────────
const INITIAL_DIMERS = 20;
const D_INTRA     = 0.42;   
const D_INTER     = 0.72;   
const R_ATOM      = 0.14;
const SPIN_LEN    = 0.58;
const HEAD_L      = 0.16;
const HEAD_R      = 0.065;
const R_ARC       = 0.35; 

const physicsParams = {
  n_dimers: INITIAL_DIMERS,
  view_mode: 'PBC anillo',
  Q: 2.10838,
  gamma: -0.28,
  alpha_ind: 0.0,
  phi_ind: 0.0,
  show_axes: true,
  show_labels: true,
  autoRotate: true
};

const matAtom = new THREE.MeshPhongMaterial({ color: 0xb4bfce, specular: 0x888ea8, shininess: 110 });
const matBond = new THREE.MeshPhongMaterial({ color: 0x8a909c, specular: 0x555560, shininess: 60 });
const matArrow = new THREE.MeshPhongMaterial({ color: 0xe01010, specular: 0xff5555, shininess: 90, emissive: 0x330000 });
const matArc = new THREE.MeshBasicMaterial({ color: 0xc41414 }); 
const WORLD_UP = new THREE.Vector3(0, 1, 0);

// ─── Helpers ────────────────────────────────────────────────────
function makeSpinArrow() {
  const group = new THREE.Group();
  const shaftLen = SPIN_LEN - HEAD_L;
  
  const mShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, shaftLen, 8), matArrow);
  mShaft.position.set(0, 0, shaftLen / 2);
  mShaft.rotation.x = Math.PI / 2;
  group.add(mShaft);

  const mHead = new THREE.Mesh(new THREE.ConeGeometry(HEAD_R, HEAD_L, 10), matArrow);
  mHead.position.set(0, 0, shaftLen + HEAD_L / 2);
  mHead.rotation.x = Math.PI / 2;
  group.add(mHead);
  
  return group;
}

function makeAxisArrow(colorHex, colorStr, length, labelText) {
  const group = new THREE.Group();
  const mat = new THREE.MeshPhongMaterial({ 
    color: colorHex, emissive: colorHex, emissiveIntensity: 0.2,
    transparent: true, opacity: 0.75 
  });

  const headL = 0.06;
  const headR = 0.025;
  const shaftLen = length - headL;
  const shaftR = 0.006; 

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, shaftLen, 8), mat);
  shaft.position.y = shaftLen / 2;
  group.add(shaft);

  const head = new THREE.Mesh(new THREE.ConeGeometry(headR, headL, 10), mat);
  head.position.y = shaftLen + headL / 2;
  group.add(head);

  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  canvas.width = 128; canvas.height = 128; // Mayor resolución para los ejes
  context.font = "bold 56px Arial";
  context.fillStyle = colorStr;
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillText(labelText, 64, 64);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;

  const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.y = length + 0.08; 
  sprite.scale.set(0.25, 0.25, 1.0);
  group.add(sprite);

  return group;
}

function makeLocalAxes() {
  const group = new THREE.Group();
  const len = SPIN_LEN * 1.05; 
  
  const axisX = makeAxisArrow(0x2b5cff, "#2b5cff", len, "X");
  axisX.rotation.z = -Math.PI / 2; 
  group.add(axisX);
  
  const axisY = makeAxisArrow(0x1f9e2e, "#1f9e2e", len, "Y");
  group.add(axisY);
  
  const axisZ = makeAxisArrow(0xff9900, "#ff9900", len, "Z");
  axisZ.rotation.x = Math.PI / 2; 
  group.add(axisZ);
  
  return group;
}

function toSubscript(num) {
  const subs = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];
  return num.toString().split('').map(d => subs[d]).join('');
}

// Genera texto en alta resolución para evitar bordes borrosos
function makeTextSprite(message) {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 128; // Alta resolución
  context.font = "bold 70px Arial"; // Fuente grande
  context.fillStyle = "#a81111"; 
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillText(message, 128, 64);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter; // Previene borrosidad al acercar
  texture.generateMipmaps = false; 

  const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(spriteMaterial);
  sprite.scale.set(0.4, 0.2, 1.0); // Ajustar escala al nuevo canvas
  return sprite;
}

const chainGroup = new THREE.Group();
scene.add(chainGroup);
const spinObjects = [];
const VIEW_MODES = { ring: 'PBC anillo', line: 'Cadena lineal' };

function clearChainGroup() {
  chainGroup.traverse((obj) => { if (obj.geometry) obj.geometry.dispose(); });
  while (chainGroup.children.length > 0) chainGroup.remove(chainGroup.children[0]);
  spinObjects.length = 0;
}

function createNode(pos, basis, n) {
  const siteGroup = new THREE.Group();
  siteGroup.position.copy(pos);
  if (basis) siteGroup.setRotationFromMatrix(basis);
  
  const mAtom = new THREE.Mesh(new THREE.SphereGeometry(R_ATOM, 20, 20), matAtom);
  siteGroup.add(mAtom);

  const axes = makeLocalAxes();
  axes.visible = physicsParams.show_axes;
  siteGroup.add(axes);

  const spinPivot = new THREE.Group();
  spinPivot.add(makeSpinArrow());
  siteGroup.add(spinPivot);

  const arcMat = new THREE.LineBasicMaterial({ color: 0xc41414, transparent: true, opacity: 0.8 });
  const arcGeo = new THREE.BufferGeometry();
  const arcPos = new Float32Array(17 * 3);
  arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPos, 3));
  const arcLine = new THREE.Line(arcGeo, arcMat);
  siteGroup.add(arcLine);

  const arcHead = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.06, 8), matArc);
  siteGroup.add(arcHead);

  const label = makeTextSprite('θ' + toSubscript(n));
  label.visible = physicsParams.show_labels;
  siteGroup.add(label);
  
  chainGroup.add(siteGroup);
  spinObjects.push({ spinPivot, arcLine, arcHead, label, axes, n });
}

function buildRingChain(nDimers) {
  const siteAngles = [];
  let arcLength = 0;
  const cellLength = D_INTRA + D_INTER;
  const totalLength = nDimers * cellLength;
  const ringRadius = totalLength / (2 * Math.PI);

  for (let d = 0; d < nDimers; d++) {
    siteAngles.push((arcLength / totalLength) * 2 * Math.PI);
    arcLength += D_INTRA;
    siteAngles.push((arcLength / totalLength) * 2 * Math.PI);
    arcLength += D_INTER;
  }

  siteAngles.forEach((angle, n) => {
    const tangent = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle)).normalize(); 
    const normal = new THREE.Vector3(0, 1, 0); 
    const inward = new THREE.Vector3(-Math.cos(angle), 0, -Math.sin(angle)).normalize(); 
    const basis = new THREE.Matrix4().makeBasis(tangent, normal, inward);
    
    const atomPos = new THREE.Vector3(ringRadius * Math.cos(angle), 0, ringRadius * Math.sin(angle));
    createNode(atomPos, basis, n);
  });

  for (let i = 0; i < siteAngles.length; i++) {
    const j = (i + 1) % siteAngles.length;
    const a0 = siteAngles[i];
    let a1 = siteAngles[j];
    if (j === 0) a1 += 2 * Math.PI;

    const angleGap = (R_ATOM / ringRadius) * 0.9;
    const startArc = a0 + angleGap;
    const endArc = a1 - angleGap;
    if (endArc <= startArc) continue;

    const points = [];
    for (let s = 0; s <= 12; s++) {
      const a = startArc + (s / 12) * (endArc - startArc);
      points.push(new THREE.Vector3(ringRadius * Math.cos(a), 0, ringRadius * Math.sin(a)));
    }
    const bondPath = new THREE.CatmullRomCurve3(points);
    const mBond = new THREE.Mesh(new THREE.TubeGeometry(bondPath, 12, 0.038, 8, false), matBond);
    chainGroup.add(mBond);
  }
}

function buildLineChain(nDimers) {
  const positions = [];
  let x = 0;
  for (let d = 0; d < nDimers; d++) {
    positions.push(x); x += D_INTRA;
    positions.push(x); x += D_INTER;
  }

  const totalLen = x - D_INTER;
  const xOffset = -totalLen / 2;
  positions.forEach((_, i) => positions[i] += xOffset);

  positions.forEach((posX, n) => {
    createNode(new THREE.Vector3(posX, 0, 0), null, n);
  });

  for (let i = 0; i < positions.length - 1; i++) {
    const x0 = positions[i], x1 = positions[i + 1];
    const len = (x1 - x0) - 1.8 * R_ATOM;
    if (len <= 0) continue;
    const mBond = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, len, 9), matBond);
    mBond.position.set((x0 + x1) / 2, 0, 0);
    mBond.rotation.z = Math.PI / 2; 
    chainGroup.add(mBond);
  }
}

function buildChain() {
  clearChainGroup();
  const nDimers = Math.max(2, Math.floor(physicsParams.n_dimers));
  physicsParams.n_dimers = nDimers;
  if (physicsParams.view_mode === VIEW_MODES.line) buildLineChain(nDimers);
  else buildRingChain(nDimers);
}

function updateSpins() {
  const { Q, gamma, alpha_ind, phi_ind, show_labels } = physicsParams;
  
  // Calcular el offset inicial para que el espín n=0 siempre esté alineado con Z (theta = 0)
  const offsetTheta = (0 * Q) + (gamma * 1.0) + alpha_ind * Math.sin(phi_ind);

  spinObjects.forEach((spinObj) => {
    const n = spinObj.n;
    const parity = (n % 2 === 0) ? 1.0 : -1.0;
    
    // Calcular theta puro y restarle el offset del n=0
    let rawTheta = (n * Q) + (gamma * parity) + alpha_ind * Math.sin(2.0 * Q * n + phi_ind);
    let thetaSpin = rawTheta - offsetTheta;
    
    spinObj.spinPivot.rotation.x = -thetaSpin;

    let displayTheta = thetaSpin % (2 * Math.PI);
    if (displayTheta < 0) displayTheta += 2 * Math.PI;

    if(show_labels) {
      spinObj.arcLine.visible = true;
      spinObj.arcHead.visible = true;
      spinObj.label.visible = true;

      const positions = spinObj.arcLine.geometry.attributes.position.array;
      for(let i=0; i<=16; i++) {
        const a = (i/16) * (-displayTheta);
        const v = new THREE.Vector3(0, 0, R_ARC).applyAxisAngle(new THREE.Vector3(1, 0, 0), a);
        positions[i*3] = v.x;
        positions[i*3+1] = v.y;
        positions[i*3+2] = v.z;
      }
      spinObj.arcLine.geometry.attributes.position.needsUpdate = true;

      const endV = new THREE.Vector3(0, 0, R_ARC).applyAxisAngle(new THREE.Vector3(1, 0, 0), -displayTheta);
      spinObj.arcHead.position.copy(endV);
      
      const delta = 0.01;
      const endV2 = new THREE.Vector3(0, 0, R_ARC).applyAxisAngle(new THREE.Vector3(1, 0, 0), -displayTheta - delta);
      const tangent = endV2.clone().sub(endV).normalize();
      spinObj.arcHead.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);

      // Etiqueta perfectamente legible dentro del arco
      const midV = new THREE.Vector3(0, 0, R_ARC * 0.55).applyAxisAngle(new THREE.Vector3(1, 0, 0), -displayTheta / 2);
      spinObj.label.position.copy(midV);
    } else {
      spinObj.arcLine.visible = false;
      spinObj.arcHead.visible = false;
      spinObj.label.visible = false;
    }
  });

  document.getElementById('dynamic-subtitle').innerHTML =
    `Modo = ${physicsParams.view_mode} &nbsp;|&nbsp; N<sub>d</sub> = ${physicsParams.n_dimers} &nbsp;|&nbsp; Q = ${Q.toFixed(5)} rad &nbsp;|&nbsp; γ = ${gamma.toFixed(2)} &nbsp;|&nbsp; α<sub>ind</sub> = ${alpha_ind.toFixed(2)}`;
}

buildChain();
updateSpins();

// ─── GUI Controls ─────────────────────────────────────────────────────────────
const gui = new dat.GUI({ width: 320 });
gui.add(physicsParams, 'view_mode', [VIEW_MODES.ring, VIEW_MODES.line]).name('Visualización').onChange((mode) => {
  radius = (mode === VIEW_MODES.line) ? 18 : 16;
  updateCamera();
  buildChain();
  updateSpins();
});
gui.add(physicsParams, 'n_dimers', 2, 80).step(1).name('Número de dímeros (N_d)').onFinishChange(() => { buildChain(); updateSpins(); });
gui.add(physicsParams, 'Q', 0, Math.PI).step(0.0001).name('Pitch (Q)').onChange(updateSpins);
gui.add(physicsParams, 'gamma', -Math.PI, Math.PI).step(0.01).name('Dimerización (gamma)').onChange(updateSpins);
gui.add(physicsParams, 'alpha_ind', 0.0, 1.5).step(0.01).name('Bunching (alpha_ind)').onChange(updateSpins);
gui.add(physicsParams, 'phi_ind', -Math.PI, Math.PI).step(0.01).name('Fase (phi_ind)').onChange(updateSpins);

const folderVis = gui.addFolder('Apoyo Visual');
folderVis.add(physicsParams, 'show_axes').name('Mostrar ejes locales').onChange(v => spinObjects.forEach(s => s.axes.visible = v));
folderVis.add(physicsParams, 'show_labels').name('Mostrar ángulos (θᵢ)').onChange(updateSpins);
folderVis.open();

gui.add(physicsParams, 'autoRotate').name('Auto-rotación');

// ─── Camera & Mouse Controls ──────────────────────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;
let phi = Math.PI / 6, theta_cam = 0.3, radius = 16;

function updateCamera() {
  camera.position.x = radius * Math.sin(phi) * Math.sin(theta_cam);
  camera.position.y = radius * Math.cos(phi);
  camera.position.z = radius * Math.sin(phi) * Math.cos(theta_cam);
  camera.lookAt(0, 0, 0);
}
updateCamera();

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; physicsParams.autoRotate = false; });
renderer.domElement.addEventListener('mouseup',   () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  theta_cam -= (e.clientX - lastX) * 0.008;
  phi = Math.max(0.15, Math.min(Math.PI - 0.1, phi + (e.clientY - lastY) * 0.006));
  lastX = e.clientX; lastY = e.clientY; updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  radius = Math.max(5, Math.min(35, radius + e.deltaY * 0.02)); updateCamera(); e.preventDefault();
}, { passive: false });

function animate() {
  requestAnimationFrame(animate);
  if (physicsParams.autoRotate) { theta_cam += 0.004; updateCamera(); }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
